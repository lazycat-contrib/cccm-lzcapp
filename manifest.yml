name: CCCM
package: czyt.tech.app.cccm
version: 0.1.2
min_os_version: 1.3.8
description: Claude Code配置管理器
homepage: https://github.com/dockers-x/cccm
author: czyt
application:
    subdomain: cccm
    public_path:
        - /
    routes:
        - /=http://cccm:3000
    background_task: true

services:
    cccm:
        # czyt/cccm:v0.1.2
        image: registry.lazycat.cloud/czyt/czyt/cccm:db942e316cb43953
        environment:
            # Admin password for the web interface
            - ADMIN_PASSWORD={{ .U.admin_password}}
            # Database configuration
            - DATABASE_PATH=/app/data/config.db
            # Logging level
            - RUST_LOG=debug

        binds:
            - /lzcapp/var/data:/app/data
        setup_script: |
            chown -R appuser:appuser /app/data
