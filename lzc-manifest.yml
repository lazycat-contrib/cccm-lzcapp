application:
  subdomain: cccm
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cccm:3000
  background_task: true

services:
  cccm:
    # upstream: czyt/cccm:v0.1.2
    image: czyt/cccm:v0.1.2
    environment:
      # Admin password for the web interface
      - ADMIN_PASSWORD={{ .U.admin_password}}
      # Database configuration
      - DATABASE_PATH=/app/data/config.db
      # Logging level
      - RUST_LOG=debug
    binds:
      - /lzcapp/var/data:/app/data
    setup_script: |
      chown -R appuser:appuser /app/data
